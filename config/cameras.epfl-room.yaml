# EPFL "room" test kaydı: aynı odayı iki farklı açıdan gören 2 kamera, 4 kişi.
# İndirme: https://documents.epfl.ch/groups/c/cv/cvlab-pom-video1/www/4p-c0.avi (ve 4p-c1.avi)
# Dosyaları videos/room/ altına koyun, sonra:
#   python src/__main__.py --cameras config/cameras.epfl-room.yaml

process_fps: 6

cameras:
  - id: 0
    name: room-c0
    source: videos/room/4p-c0.avi
    # Faz 4: zemindeki alanlar ve sayaç çizgisi (görüntü pikseli; tools/draw_zones.py ile çizilir)
    zones:
      desenli_hali: [[4, 140], [118, 90], [189, 114], [40, 178]]
      mavi_hali: [[240, 112], [358, 160], [358, 288], [60, 288], [15, 225]]
    lines:
      orta_hat: [[180, 110], [180, 288]]
  - id: 1
    name: room-c1
    source: videos/room/4p-c1.avi
    zones:
      desenli_hali: [[5, 192], [95, 160], [252, 260], [230, 288], [5, 288]]
      mavi_hali: [[110, 137], [205, 100], [355, 125], [355, 262], [245, 250], [150, 170]]

# Kameralar arası zemin eşlemesi (homografi): "kaynak-hedef" kamera id'leri.
# Bu iki kamera aynı odayı gördüğü için, Kamera 0'daki bir kişinin ayak noktası
# bu matrisle Kamera 1'deki görüntü koordinatına çevrilebilir.
# Doğrulama: izdüşürülen noktaların %61'i gerçek bir ayağa 30 px'ten yakın düşüyor.
# Yeni kurulum için: python tools/calibrate_homography.py
homographies:
  "0-1": [[8.67880128, 45.28411211, -5167.53237445],
          [-2.20867665, 7.96352372, 2044.28289896],
          [0.04583942, 0.05740988, 1.00000000]]

# Kamera topolojisi (Faz 2): bu iki kamera aynı odayı görüyor, yani bir kişi
# ikisinde aynı anda görünebilir. Bu satır olmasaydı sistem "aynı kişi iki yerde
# olamaz" kuralını uygular ve odadaki herkesi iki kişi sayardı.
topology:
  overlapping: [[0, 1]]
