# Kamera tanımları / Camera definitions
#
# Kamera eklemek için listeye yeni bir öğe eklemeniz yeterli, kod değişikliği gerekmez.
# To add a camera, append an entry below; no code change is required.
#
#   id          : Benzersiz tam sayı. Kayıtlarda ve kameralar arası ayarlarda bu kullanılır.
#   name        : Ekranda ve loglarda görünen ad.
#   source      : Webcam numarası (0, 1, ...), video dosyası yolu (proje köküne göre)
#                 ya da ağ akışı adresi (rtsp://..., http://...).
#   process_fps : (İsteğe bağlı) Bu kamera saniyede kaç kare işlensin.
#                 Belirtilmezse aşağıdaki varsayılan kullanılır.
#
# Telefonu ikinci kamera olarak kullanmak için örnek:
#   "IP Webcam" (Android) ya da "DroidCam" uygulamasını açın, gösterdiği adresi
#   source olarak yazın, örn: http://192.168.1.20:8080/video

process_fps: 6

cameras:
  - id: 0
    name: laptop
    source: 0

  # - id: 1
  #   name: telefon
  #   source: http://192.168.1.20:8080/video

  # - id: 2
  #   name: koridor
  #   source: videos/koridor.mp4

# Kamera yerleşimi / topoloji (Faz 2, isteğe bağlı)
#
# Kural 1: Bir kişi aynı anda iki farklı yerde olamaz. Aynı alanı gören kameraları
#          `overlapping` altında belirtin, onlar bu kuraldan muaf olur.
# Kural 2: Bir kameradan diğerine yürümek en az `min_seconds` sürer. Daha hızlı
#          "geçiş" yapan bir eşleşme imkânsız sayılır. Doğrudan bağlı olmayan
#          kameralar için yol üzerindeki süreler toplanır (0->1->2 = 3+5 = 8 s).
#          `max_seconds` sadece raporlama içindir (kişi arada oyalanmış olabilir).
# Süreleri bilmiyorsanız önce boş bırakıp çalıştırın: program kapanırken ve
# loglarda "TRANSITION" satırlarında gözlenen geçiş süreleri yazılır.
#
# topology:
#   overlapping: [[3, 4]]
#   default_min_seconds: 0
#   transitions:
#     - {cameras: [0, 1], min_seconds: 3, max_seconds: 60}   # kapı <-> koridor
#     - {cameras: [1, 2], min_seconds: 5, max_seconds: 120}  # koridor <-> ofis
